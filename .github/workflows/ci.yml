name: CI

# 触发：推送到 main 与所有 PR。课程项目不需要矩阵构建，两个 job 覆盖「后端能编译」+「前端类型与构建通过」。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新提交取消上一轮，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 编译
    runs-on: ubuntu-latest
    # 后端编译实测 25s；给 10 分钟上限，卡住就快速失败，不要挂几个小时
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 编译门槛与本地一致：警告即视为失败（项目已做到 0 警告，别让回归悄悄溜进来）
      - name: 还原
        run: dotnet restore eRentalSystem.slnx

      - name: 编译（Release，警告视为错误）
        run: dotnet build eRentalSystem.slnx -c Release --no-restore -warnaserror

  frontend:
    name: 前端 类型检查 + 构建
    runs-on: ubuntu-latest
    # 正常 1~2 分钟能跑完；超过 15 分钟必是依赖下载卡住，直接判失败
    # （此前一次跑满 4h46m 才被 SIGABRT 打断，就是 npm 在境外拉国内镜像拉不动）
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json

      # package-lock.json 里的 resolved 一律指向官方源；本地开发用的 npmmirror
      # 只写在 ~/.npmrc 里（不进仓库），所以这里显式钉住官方源，
      # 避免 runner 上拿不到国内镜像却按镜像地址去下载。
      - name: 安装依赖
        # fetch-timeout 从 npm 默认的 5 分钟压到 60 秒：真拉不动时一步就报错，
        # 而不是每个包静默等 5 分钟、整步挂上几个小时（上次就是挂了 4h46m）
        run: npm ci --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=2
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      # tsc --noEmit：只做类型检查，不产出文件；vite build 才是真实产物验证
      - name: 类型检查
        run: npx tsc --noEmit

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: front/dist
          retention-days: 7
